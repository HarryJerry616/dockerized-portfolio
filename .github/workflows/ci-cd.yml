name: Dockerized Portfolio DevSecOps Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  lint:
    name: HTML Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install HTMLHint
        run: |
          npm install -g htmlhint

      - name: Run HTML Lint
        run: |
          htmlhint index.html
          
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t dockerized-portfolio .

  test:
    name: Test Docker Container
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t dockerized-portfolio .

      - name: Run Docker Container
        run: |
          docker run -d -p 8080:80 --name portfolio dockerized-portfolio

      - name: Verify Container is Running
        run: |
          docker ps
          curl http://localhost:8080

  sca:
    name: SCA - Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t dockerized-portfolio .

      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: dockerized-portfolio
          format: table
          exit-code: 0

  sast:
    name: SAST - CodeQL Analysis
    runs-on: ubuntu-latest
    needs: sca

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: sast

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

     dast:
        name: DAST - OWASP ZAP Scan
        runs-on: ubuntu-latest
        needs: deploy

        steps:
          - name: OWASP ZAP Scan
            uses: zaproxy/action-baseline@v0.12.0
            with:
            target: 'https://harryjerry616.github.io/dockerized-portfolio/'
